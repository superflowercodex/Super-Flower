<!DOCTYPE html>
<html lang="en">
<head>

<title>Super Flower Codex</title>

<style>

/* =========================================================
   SUPER FLOWER CODEX
   GOLD NEON / BLACK / WHITE
========================================================= */

:root{
    --gold:#ffd21a;
    --gold-soft:#d4af37;
    --gold-hot:#fff3a3;
    --white:#ffffff;
    --black:#000000;
}

/* =========================================================
   GLOBAL
========================================================= */

*{
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    margin:0;
    min-height:100vh;
    background:#000;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
    overflow-x:hidden;
}

/* =========================================================
   COSMIC BACKGROUND
========================================================= */

body::before{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:-5;

    background:
        radial-gradient(
            circle at 50% 15%,
            rgba(255,210,26,.16) 0%,
            rgba(255,210,26,.07) 18%,
            transparent 42%
        ),
        radial-gradient(
            circle at 10% 55%,
            rgba(255,255,255,.06),
            transparent 28%
        ),
        radial-gradient(
            circle at 90% 75%,
            rgba(255,210,26,.08),
            transparent 30%
        ),
        #000;
}

/* Fine gold star field */

body::after{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:-4;

    background-image:
        radial-gradient(circle, rgba(255,255,255,.8) 1px, transparent 1px),
        radial-gradient(circle, rgba(255,210,26,.8) 1px, transparent 1px);

    background-size:
        145px 145px,
        220px 220px;

    background-position:
        20px 30px,
        90px 100px;

    opacity:.28;
}

/* =========================================================
   MAIN CONTAINER
========================================================= */

.container{
    position:relative;

    width:100%;
    max-width:900px;

    min-height:100vh;

    margin:0 auto;

    padding:
        35px
        20px
        70px;

    text-align:center;

    overflow:hidden;
}

/* =========================================================
   DECORATIVE GOLD HALO
========================================================= */

.hero{
    position:relative;

    padding:
        20px
        0
        15px;

    margin-bottom:25px;
}

.hero::before{
    content:"";

    position:absolute;

    width:620px;
    height:620px;

    max-width:95vw;
    max-height:95vw;

    left:50%;
    top:48%;

    transform:translate(-50%,-50%);

    border:
        1px solid rgba(255,210,26,.32);

    border-radius:50%;

    box-shadow:
        0 0 20px rgba(255,210,26,.22),
        0 0 60px rgba(255,210,26,.12),
        inset 0 0 50px rgba(255,210,26,.08);

    pointer-events:none;
}

.hero::after{
    content:"";

    position:absolute;

    width:480px;
    height:480px;

    max-width:75vw;
    max-height:75vw;

    left:50%;
    top:48%;

    transform:translate(-50%,-50%);

    border:
        1px solid rgba(255,255,255,.12);

    border-radius:50%;

    pointer-events:none;
}

/* =========================================================
   LOGO
========================================================= */

.logo-wrap{
    position:relative;
    z-index:2;

    display:flex;
    justify-content:center;
    align-items:center;

    min-height:430px;
}

.logo{
    width:420px;
    max-width:92%;

    height:auto;

    display:block;

    margin:0 auto;

    filter:
        drop-shadow(0 0 5px rgba(255,210,26,.95))
        drop-shadow(0 0 18px rgba(255,210,26,.65))
        drop-shadow(0 0 42px rgba(255,210,26,.25));

    animation:
        logoGlow 4s ease-in-out infinite;
}

@keyframes logoGlow{

    0%,100%{
        filter:
            drop-shadow(0 0 5px rgba(255,210,26,.9))
            drop-shadow(0 0 18px rgba(255,210,26,.55))
            drop-shadow(0 0 38px rgba(255,210,26,.2));
    }

    50%{
        filter:
            drop-shadow(0 0 8px rgba(255,255,255,1))
            drop-shadow(0 0 25px rgba(255,210,26,.9))
            drop-shadow(0 0 55px rgba(255,210,26,.35));
    }

}

/* =========================================================
   GOLD DIVIDER
========================================================= */

.divider{
    display:flex;
    align-items:center;
    justify-content:center;

    gap:14px;

    margin:
        0 auto
        30px;

    width:min(700px,90%);
}

.divider-line{
    height:1px;
    flex:1;

    background:
        linear-gradient(
            90deg,
            transparent,
            var(--gold),
            transparent
        );

    box-shadow:
        0 0 8px rgba(255,210,26,.8);
}

.divider-symbol{
    color:var(--gold);

    font-size:22px;

    text-shadow:
        0 0 6px #fff,
        0 0 14px var(--gold),
        0 0 30px var(--gold);
}

/* =========================================================
   NAVIGATION
========================================================= */

.navigation{
    position:relative;
    z-index:5;

    width:100%;
    max-width:720px;

    margin:0 auto;
}

/* =========================================================
   BUTTON
========================================================= */

.button{
    position:relative;

    display:flex;

    align-items:center;

    width:100%;

    min-height:96px;

    margin:
        18px
        0;

    padding:
        16px
        24px;

    overflow:hidden;

    color:#fff;

    text-decoration:none;

    background:
        linear-gradient(
            105deg,
            rgba(255,255,255,.025),
            rgba(255,210,26,.035),
            rgba(0,0,0,.8)
        );

    border:
        1px solid rgba(255,210,26,.85);

    border-radius:18px;

    box-shadow:
        0 0 5px rgba(255,210,26,.65),
        0 0 18px rgba(255,210,26,.25),
        inset 0 0 18px rgba(255,210,26,.05);

    transition:
        transform .3s ease,
        box-shadow .3s ease,
        border-color .3s ease,
        background .3s ease;
}

/* Moving light */

.button::before{
    content:"";

    position:absolute;

    top:0;
    left:-120%;

    width:70%;
    height:100%;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(255,255,255,.14),
            rgba(255,210,26,.2),
            transparent
        );

    transform:skewX(-20deg);

    transition:left .65s ease;

    pointer-events:none;
}

.button:hover::before{
    left:140%;
}

/* Inner glow */

.button::after{
    content:"";

    position:absolute;

    inset:3px;

    border-radius:15px;

    border:1px solid rgba(255,255,255,.06);

    pointer-events:none;
}

/* =========================================================
   BUTTON HOVER
========================================================= */

.button:hover{
    transform:
        translateY(-3px)
        scale(1.01);

    border-color:
        var(--gold-hot);

    background:
        linear-gradient(
            105deg,
            rgba(255,210,26,.08),
            rgba(255,255,255,.04),
            rgba(0,0,0,.85)
        );

    box-shadow:
        0 0 8px rgba(255,255,255,.8),
        0 0 22px rgba(255,210,26,.75),
        0 0 55px rgba(255,210,26,.28),
        inset 0 0 25px rgba(255,210,26,.1);
}

/* =========================================================
   ICON
========================================================= */

.icon{
    position:relative;
    z-index:2;

    width:58px;
    min-width:58px;
    height:58px;

    display:flex;

    align-items:center;
    justify-content:center;

    margin-right:22px;

    border:
        1px solid var(--gold);

    border-radius:14px;

    color:var(--gold-hot);

    font-size:27px;

    text-shadow:
        0 0 7px #fff,
        0 0 15px var(--gold);

    box-shadow:
        0 0 8px rgba(255,210,26,.5),
        inset 0 0 12px rgba(255,210,26,.08);
}

/* =========================================================
   BUTTON TEXT
========================================================= */

.button-text{
    position:relative;
    z-index:2;

    flex:1;

    text-align:left;
}

.button-title{
    display:block;

    color:#fff;

    font-family:
        Georgia,
        "Times New Roman",
        serif;

    font-size:
        clamp(1.35rem,3vw,1.8rem);

    font-weight:bold;

    letter-spacing:
        .08em;

    text-shadow:
        0 0 5px rgba(255,255,255,.8),
        0 0 15px rgba(255,210,26,.3);
}

.button-subtitle{
    display:block;

    margin-top:7px;

    color:
        rgba(255,255,255,.75);

    font-size:
        .72rem;

    letter-spacing:
        .18em;

    text-transform:
        uppercase;
}

/* =========================================================
   ARROW
========================================================= */

.arrow{
    position:relative;
    z-index:2;

    margin-left:15px;

    color:#fff;

    font-size:32px;

    line-height:1;

    text-shadow:
        0 0 6px #fff,
        0 0 14px var(--gold),
        0 0 25px var(--gold);

    transition:
        transform .3s ease;
}

.button:hover .arrow{
    transform:
        translateX(7px);

    color:
        var(--gold-hot);
}

/* =========================================================
   FOOTER
========================================================= */

.footer{
    position:relative;

    margin-top:55px;

    padding-top:10px;

    color:
        rgba(255,255,255,.85);

    font-size:
        .8rem;

    letter-spacing:
        .3em;

    text-transform:
        uppercase;

    text-shadow:
        0 0 7px #fff,
        0 0 15px rgba(255,210,26,.4);
}

/* =========================================================
   FOOTER GLOW
========================================================= */

.footer::before{
    content:"✦";

    display:block;

    margin-bottom:18px;

    color:
        var(--gold);

    font-size:
        24px;

    text-shadow:
        0 0 8px #fff,
        0 0 18px var(--gold),
        0 0 35px var(--gold);
}

/* =========================================================
   RESPONSIVE
========================================================= */

@media(max-width:600px){

    .container{
        padding:
            15px
            14px
            45px;
    }

    .hero{
        padding-top:5px;
    }

    .logo-wrap{
        min-height:330px;
    }

    .logo{
        width:370px;
        max-width:94%;
    }

    .hero::before{
        width:430px;
        height:430px;
    }

    .hero::after{
        width:340px;
        height:340px;
    }

    .button{
        min-height:82px;

        padding:
            12px
            14px;

        border-radius:14px;

        margin:
            14px 0;
    }

    .icon{
        width:48px;
        min-width:48px;
        height:48px;

        margin-right:13px;

        border-radius:11px;

        font-size:22px;
    }

    .button-title{
        font-size:1.15rem;

        letter-spacing:.045em;
    }

    .button-subtitle{
        font-size:.58rem;

        letter-spacing:.1em;

        margin-top:5px;
    }

    .arrow{
        font-size:26px;

        margin-left:8px;
    }

    .footer{
        font-size:.62rem;

        letter-spacing:.18em;

        line-height:1.7;
    }

}

/* =========================================================
   VERY SMALL PHONES
========================================================= */

@media(max-width:380px){

    .logo-wrap{
        min-height:290px;
    }

    .button{
        min-height:76px;
    }

    .icon{
        width:42px;
        min-width:42px;
        height:42px;

        margin-right:10px;

        font-size:19px;
    }

    .button-title{
        font-size:1rem;
    }

    .button-subtitle{
        font-size:.5rem;
    }

    .arrow{
        font-size:23px;
    }

}

/* =========================================================
   REDUCED MOTION
========================================================= */

@media(prefers-reduced-motion:reduce){

    *,
    *::before,
    *::after{
        animation:none !important;
        transition:none !important;
    }

}

</style>
